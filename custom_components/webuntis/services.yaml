get_timetable:
  description: Get WebUntis timetable
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: webuntis
    start:
      required: true
      selector:
        date:
    end:
      required: true
      selector:
        date:
    apply_filter:
      required: true
      default: true
      selector:
        boolean:
    show_cancelled:
      required: true
      default: true
      selector:
        boolean:
    compact_result:
      required: true
      default: true
      selector:
        boolean:
    compact_tolerance_minutes:
      required: false
      default: 0
      selector:
        number:
          min: 0
          step: 1
          unit_of_measurement: minutes

count_lessons:
  description: Get WebUntis timetable
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: webuntis
    start:
      required: true
      selector:
        date:
    end:
      required: true
      selector:
        date:
    apply_filter:
      required: true
      default: true
      selector:
        boolean:
    count_cancelled:
      required: true
      default: false
      selector:
        boolean:

get_schoolyears:
  description: Get WebUntis schoolyears
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: webuntis

print_homework:
  description: Render a WebUntis homework-list sensor's current data as a JPEG and print it via the ipp_printing integration.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            - integration: webuntis
              domain: sensor
    printer_entity_id:
      required: true
      description: Entity ID of the printer (an entity from the "ipp" integration), as targeted by ipp_printing.print.
      selector:
        entity:
          filter:
            - integration: ipp
    title:
      required: false
      default: Hausaufgaben
      selector:
        text:
